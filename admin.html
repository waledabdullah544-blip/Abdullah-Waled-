<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Masar Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="masar-config.js"></script>
<style>
:root{--bg:#262626;--panel:#323232;--field:#1f1f1f;--ink:#e6e6e6;--mute:#a0a0a0;--line:#444;--gold:#f0c374;--ok:#2f9e44;--bad:#c92a2a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px "Segoe UI",Cairo,sans-serif;display:flex}
a{color:var(--gold)}
#side{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px}
#side .lg{display:flex;align-items:center;gap:10px;font:700 16px inherit;font-family:inherit;margin:0 6px 18px}
#side .lg i{width:30px;height:30px;border-radius:7px;overflow:hidden;display:inline-flex;line-height:0}#side .lg i svg{width:30px;height:30px}
#side button{all:unset;padding:9px 12px;border-radius:5px;cursor:pointer;color:var(--ink);position:relative}#side button:hover{background:#3d3d3d}
#side button.on{background:#444}#side button.on::before{content:'';position:absolute;left:-6px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--gold)}
#side .me{margin-top:auto;color:var(--mute);font-size:12px;padding:8px 6px;word-break:break-all}
#main{flex:1;overflow:auto;padding:28px 34px;min-width:0}
h1{font:700 24px inherit;font-family:inherit;margin:0 0 18px}h2{font:600 15px inherit;font-family:inherit;margin:26px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}.card b{display:block;font-size:24px;margin-top:4px}.card span{color:var(--mute)}
.bar{height:8px;border-radius:4px;background:#1b1b1b;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}.bar i.w{background:var(--gold)}.bar i.d{background:var(--bad)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #3a3a3a;vertical-align:middle}th{color:var(--mute);font-weight:400}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:4px;color:var(--ink);font:inherit;padding:6px 8px}textarea{width:100%;min-height:70px}
button.b{height:30px;padding:0 14px;border-radius:15px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 12px inherit;font-family:inherit;cursor:pointer}button.b:hover{background:#3d3d3d}
button.p{background:var(--gold);border-color:var(--gold);color:#2a2a2a}button.p:hover{background:#f5d08c}button.x{color:#ff8787}
button:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700}.pill.active{background:var(--ok);color:#fff}.pill.trialing{background:var(--gold);color:#2a2a2a}.pill.expired{background:var(--bad);color:#fff}.pill.admin{background:#5c7cfa;color:#fff}
.form{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;max-width:620px}.form label{display:flex;align-items:center;gap:10px;margin:8px 0}.form label>span{width:190px;color:var(--mute)}
.tools{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}.tc .th{height:140px;background:#1b1b1b;border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}.tc .th img{max-width:100%;max-height:100%}
.tc input[type=text]{width:100%;margin:3px 0}.tc .row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mute);margin-bottom:16px}.drop.over{border-color:var(--gold);color:var(--ink)}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--line);padding:10px 18px;border-radius:8px;display:none;z-index:9}
#login{margin:auto;max-width:360px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px}#login input{width:100%;margin:6px 0 12px;height:34px}
.muted{color:var(--mute)}.warn{color:var(--gold)}.err{color:#ff8787}
</style>
</head>
<body>
<div id="app" style="display:contents"></div><div id="msg" role="status"></div>
<script>
'use strict';
const C=()=>{let c={...(window.MASAR_CLOUD_CONFIG||{})};try{const o=JSON.parse(localStorage.getItem('masar.cloud.cfg')||'null');if(o&&o.url&&o.key)c=o}catch(_){}c.url=String(c.url||'').replace(/\/+$/,'');return c};
const SK='masar.cloud.session';let S=null;try{S=JSON.parse(localStorage.getItem(SK)||'null')}catch(_){}
const saveS=s=>{S=s;try{s?localStorage.setItem(SK,JSON.stringify(s)):localStorage.removeItem(SK)}catch(_){}};
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const $=s=>document.querySelector(s),app=$('#app');
const msg=(t,bad)=>{const m=$('#msg');m.textContent=t;m.style.color=bad?'#ff8787':'';m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',3500)};
const errOf=async r=>{let m='';try{const j=await r.json();m=j.msg||j.message||j.error_description||j.error||''}catch(_){}return new Error(m||('Error '+r.status))};
async function auth(path,body){const c=C();const r=await fetch(c.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw await errOf(r);return r.json()}
const sess=d=>({at:d.access_token,rt:d.refresh_token,exp:Date.now()+((+d.expires_in||3600)-60)*1000,id:d.user&&d.user.id,email:d.user&&d.user.email});
let RENEW=null;async function tok(){if(!S)throw new Error('Sign in');if(Date.now()>S.exp){RENEW=RENEW||auth('token?grant_type=refresh_token',{refresh_token:S.rt}).then(d=>saveS(sess(d))).finally(()=>{RENEW=null});await RENEW}return S.at}
async function api(method,path,body,prefer){const c=C(),t=await tok();const r=await fetch(c.url+path,{method,headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'application/json',...(prefer?{Prefer:prefer}:{})},body:body==null?undefined:JSON.stringify(body)});if(!r.ok)throw await errOf(r);const x=await r.text();return x?JSON.parse(x):null}
const rest=(m,p,b,pr)=>api(m,'/rest/v1/'+p,b,pr),rpc=(f,b)=>api('POST','/rest/v1/rpc/'+f,b||{});
async function upload(bucket,path,blob,type){const c=C(),t=await tok();const r=await fetch(c.url+'/storage/v1/object/'+bucket+'/'+path,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':type||blob.type||'application/octet-stream','x-upsert':'true'},body:blob});if(!r.ok)throw await errOf(r);return path}
async function remove(bucket,paths){const c=C(),t=await tok();await fetch(c.url+'/storage/v1/object/'+bucket,{method:'DELETE',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({prefixes:paths})})}
const pub=p=>C().url+'/storage/v1/object/public/template-thumbs/'+p.split('/').map(encodeURIComponent).join('/');
const money=(c,cur)=>((c||0)/100).toLocaleString('en-US',{maximumFractionDigits:2})+' '+(cur||'EGP');
const day=d=>d?new Date(d).toLocaleDateString():'–';
const stOf=p=>p.is_admin?'admin':p.period_end&&Date.parse(p.period_end)>Date.now()?'active':p.trial_end&&Date.parse(p.trial_end)>Date.now()?'trialing':'expired';

/* ---------- sign in (admins only) ---------- */
function login(note){app.innerHTML='<div id="login"><h1>Masar Admin</h1>'+(C().url?'':'<p class="err">No server set: put the URL and key in masar-config.js.</p>')+(note?'<p class="err">'+esc(note)+'</p>':'')+
  '<label>Email<input id="le" type="email" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password"></label><button class="b p" id="lgo" style="width:100%">Sign in</button>'+
  '<p style="margin-top:12px;text-align:center"><a href="#" id="lg">Sign in with Google</a></p></div>';
  $('#lgo').onclick=async()=>{try{saveS(sess(await auth('token?grant_type=password',{email:$('#le').value.trim(),password:$('#lp').value})));start()}catch(e){login(e.message)}};
  $('#lp').onkeydown=e=>{if(e.key==='Enter')$('#lgo').click()};
  $('#lg').onclick=e=>{e.preventDefault();location.href=C().url+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin+location.pathname)}}
async function start(){const h=new URLSearchParams(location.hash.slice(1));if(h.get('access_token')){try{const c=C(),r=await fetch(c.url+'/auth/v1/user',{headers:{apikey:c.key,Authorization:'Bearer '+h.get('access_token')}});if(r.ok){const u=await r.json();saveS(sess({access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_in:h.get('expires_in'),user:u}))}}catch(_){}history.replaceState(null,'',location.pathname)}
  if(!S)return login();try{ME=await rpc('masar_me')}catch(e){saveS(null);return login(e.message)}
  if(!ME||!ME.admin)return login('This account is not an admin. Make it admin once in the Supabase SQL editor (see README).');
  shell()}
function shell(){const T=[['dash','Dashboard'],['cust','Customers'],['pay','Payments'],['plans','Plans & trial'],['tpl','Templates'],['ann','Home banner'],['mail','Emails']];
  app.innerHTML='<nav id="side"><div class="lg"><i>'+LOGO+'</i>Masar Admin</div>'+T.map(t=>'<button data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'<div class="me">'+esc(S.email)+'<br><a href="#" id="out">Sign out</a> · <a href="./">Open Masar</a></div></nav><main id="main"></main>';
  document.querySelectorAll('#side [data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));$('#out').onclick=e=>{e.preventDefault();saveS(null);login()};go(TAB)}
function go(t){TAB=t;document.querySelectorAll('#side [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));const m=$('#main');m.innerHTML='<p class="muted">Loading…</p>';
  ({dash,cust,pay,plans,tpl,ann,mail})[t](m).catch(e=>{m.innerHTML='<p class="err">'+esc(e.message)+'</p>'})}
/* ---------- dashboard ---------- */
const QUOTA={brevo:300,mailjet:200,resend:100},DBMAX=500*1048576;
async function dash(m){const s=await rpc('masar_admin_stats');const set=(await rest('GET','settings?id=eq.1&select=currency'))[0]||{};const cur=set.currency;
  const card=(t,v,sub)=>'<div class="card"><span>'+t+'</span><b>'+v+'</b>'+(sub?'<span>'+sub+'</span>':'')+'</div>';
  const pct=(a,b)=>Math.min(100,Math.round(a/b*100)),barc=p=>p>=90?'d':p>=70?'w':'';
  const dbp=pct(s.db_bytes,DBMAX);
  m.innerHTML='<h1>Dashboard</h1><div class="cards">'+card('Customers',s.users,'+'+s.new_7d+' this week')+card('Paying',s.active,s.monthly+' monthly · '+s.yearly+' yearly')+card('On trial',s.trialing)+card('Ended',s.expired)+
    card('Revenue (30 days)',money(s.revenue_30d_cents,cur))+card('Revenue (all time)',money(s.revenue_all_cents,cur))+card('Templates',s.templates)+'</div>'+
    '<h2>Limits (free plans)</h2><div class="cards"><div class="card"><span>Database</span><b>'+(s.db_bytes/1048576).toFixed(1)+' MB</b><span>of 500 MB (Supabase free)</span><div class="bar"><i class="'+barc(dbp)+'" style="width:'+dbp+'%"></i></div>'+(dbp>=80?'<p class="warn">Time to move to Supabase Pro.</p>':'')+'</div>'+
    Object.keys(QUOTA).map(k=>{const n=(s.emails_today||{})[k]||0,p=pct(n,QUOTA[k]);return'<div class="card"><span>Emails today · '+k+'</span><b>'+n+'</b><span>free: '+QUOTA[k]+' / day</span><div class="bar"><i class="'+barc(p)+'" style="width:'+p+'%"></i></div></div>'}).join('')+
    '<div class="card"><span>Emails today · Amazon SES</span><b>'+((s.emails_today||{}).ses||0)+'</b><span>paid per use (only after the free ones)</span></div><div class="card"><span>Email failures today</span><b class="'+(s.email_fail_today?'err':'')+'">'+s.email_fail_today+'</b></div></div>'}
/* ---------- customers ---------- */
async function cust(m,q){q=q||'';const f=q?'&or=(email.ilike.*'+encodeURIComponent(q)+'*,name.ilike.*'+encodeURIComponent(q)+'*)':'';
  const L=await rest('GET','profiles?select=id,email,name,is_admin,trial_end,plan,period_end,canceled,created_at,last_seen&order=created_at.desc&limit=300'+f);
  m.innerHTML='<h1>Customers</h1><div class="tools"><input id="cq" type="search" placeholder="Search email or name" value="'+esc(q)+'" style="width:280px"><span class="muted">'+L.length+' shown</span></div>'+
   '<table><thead><tr><th>Email</th><th>Name</th><th>Status</th><th>Plan</th><th>Until</th><th>Joined</th><th>Last seen</th><th></th></tr></thead><tbody>'+L.map(p=>{const st=stOf(p);
    return'<tr><td>'+esc(p.email)+'</td><td>'+esc(p.name||'')+'</td><td><span class="pill '+st+'">'+st+'</span>'+(p.canceled?' <span class="muted">no reminders</span>':'')+'</td><td>'+(p.plan||'–')+'</td><td>'+day(st==='trialing'?p.trial_end:p.period_end)+'</td><td>'+day(p.created_at)+'</td><td>'+day(p.last_seen)+'</td>'+
    '<td style="white-space:nowrap"><button class="b" data-g="'+p.id+'" data-d="30" data-p="monthly">+30 days</button> <button class="b" data-g="'+p.id+'" data-d="365" data-p="yearly">+1 year</button> <button class="b x" data-g="'+p.id+'" data-d="0">End</button> <button class="b" data-adm="'+p.id+'" data-v="'+(p.is_admin?0:1)+'">'+(p.is_admin?'Remove admin':'Make admin')+'</button></td></tr>'}).join('')+'</tbody></table>';
  const cq=$('#cq');cq.onchange=()=>cust(m,cq.value.trim());
  m.querySelectorAll('[data-g]').forEach(b=>b.onclick=async()=>{const d=+b.dataset.d;if(!d&&!confirm('End this subscription now?'))return;try{await rpc('masar_admin_grant',{uid:b.dataset.g,p:b.dataset.p||null,days:d});msg(d?'Added '+d+' days':'Subscription ended');cust(m,q)}catch(e){msg(e.message,1)}});
  m.querySelectorAll('[data-adm]').forEach(b=>b.onclick=async()=>{if(!confirm(b.dataset.v==='1'?'Make this account an admin? Admins can see all customers and payments.':'Remove admin?'))return;try{await rest('PATCH','profiles?id=eq.'+b.dataset.adm,{is_admin:b.dataset.v==='1'});cust(m,q)}catch(e){msg(e.message,1)}})}
/* ---------- payments ---------- */
async function pay(m){const L=await rest('GET','payments?select=created_at,user_id,plan,amount_cents,currency,success,provider_txn&order=created_at.desc&limit=300');
  const ids=[...new Set(L.map(p=>p.user_id).filter(Boolean))];const P=ids.length?await rest('GET','profiles?select=id,email&id=in.('+ids.join(',')+')'):[];const em=Object.fromEntries(P.map(p=>[p.id,p.email]));
  const ok=L.filter(p=>p.success),sum=ok.reduce((a,p)=>a+(p.amount_cents||0),0);
  m.innerHTML='<h1>Payments</h1><p class="muted">'+ok.length+' successful · '+money(sum,ok[0]&&ok[0].currency)+' (last 300)</p><table><thead><tr><th>Date</th><th>Customer</th><th>Plan</th><th>Amount</th><th>Result</th><th>Paymob transaction</th></tr></thead><tbody>'+
    L.map(p=>'<tr><td>'+new Date(p.created_at).toLocaleString()+'</td><td>'+esc(em[p.user_id]||'')+'</td><td>'+esc(p.plan||'')+'</td><td>'+money(p.amount_cents,p.currency)+'</td><td>'+(p.success?'<span class="pill active">paid</span>':'<span class="muted">not completed</span>')+'</td><td>'+esc(p.provider_txn||'')+'</td></tr>').join('')+'</tbody></table>'}
/* ---------- plans & trial ---------- */
async function plans(m){const s=(await rest('GET','settings?id=eq.1&select=*'))[0];
  const row=(k,label,v,extra)=>'<label><span>'+label+'</span><input data-k="'+k+'" type="number" min="0" step="'+(extra||1)+'" value="'+v+'" style="width:140px"></label>';
  m.innerHTML='<h1>Plans &amp; trial</h1><div class="form">'+row('trial_days','Free trial (days)',s.trial_days)+row('price_monthly','Monthly price',s.price_monthly_cents/100,'0.01')+row('price_yearly','Yearly price',s.price_yearly_cents/100,'0.01')+
    '<label><span>Currency</span><input data-k="currency" value="'+esc(s.currency)+'" style="width:140px"></label>'+row('grace_days','Works offline for (days)',s.grace_days)+row('remind_days','Remind before the end (days)',s.remind_days)+
    '<p class="muted">A price of 0 hides that plan. The trial length applies to new accounts.</p><button class="b p" id="sv">Save</button></div>';
  $('#sv').onclick=async()=>{const v=k=>m.querySelector('[data-k="'+k+'"]').value;try{await rest('PATCH','settings?id=eq.1',{trial_days:+v('trial_days'),price_monthly_cents:Math.round(+v('price_monthly')*100),price_yearly_cents:Math.round(+v('price_yearly')*100),currency:v('currency').trim()||'EGP',grace_days:+v('grace_days'),remind_days:+v('remind_days'),updated_at:new Date().toISOString()},'return=minimal');msg('Saved')}catch(e){msg(e.message,1)}}}
/* ---------- templates ---------- */
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
function svgSize(t){const d=new DOMParser().parseFromString(t,'image/svg+xml').documentElement,n=v=>{const m=/^([\d.]+)\s*(px|pt|mm|cm|in)?$/.exec(v||'');return m?{v:+m[1],u:m[2]||'px'}:null};const W=n(d.getAttribute('width')),H=n(d.getAttribute('height'));
  if(W&&H)return{w:W.v,h:H.v,u:W.u};const vb=(d.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);return vb.length===4?{w:vb[2],h:vb[3],u:'px'}:{w:800,h:600,u:'px'}}
function thumbFromSvg(t){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=480/Math.max(im.naturalWidth||1,im.naturalHeight||1),c=document.createElement('canvas');c.width=Math.max(1,Math.round((im.naturalWidth||480)*k));c.height=Math.max(1,Math.round((im.naturalHeight||480)*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.82)};im.onerror=()=>res(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t)})}
async function addTemplate(file){const txt=await file.text(),isSvg=/^\s*</.test(txt);let size={w:800,h:600,u:'px'},title=file.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ');
  if(isSvg)size=svgSize(txt);else{const D=JSON.parse(txt);if(!D.masar)throw new Error(file.name+': not a Masar or SVG file');const a=(D.arts&&D.arts[D.abi||0])||{w:D.ab&&D.ab[0],h:D.ab&&D.ab[1]};size={w:a.w||800,h:a.h||600,u:'px'}}
  const id=uid(),ext=isSvg?'svg':'masar',path=id+'.'+ext;await upload('templates',path,new Blob([txt],{type:isSvg?'image/svg+xml':'application/json'}));
  let thumb=null;if(isSvg){const b=await thumbFromSvg(txt);if(b)thumb=await upload('template-thumbs',id+'.jpg',b,'image/jpeg')}
  return rest('POST','templates',{title,category:'General',width:size.w,height:size.h,unit:size.u,file_path:path,thumb_path:thumb,published:false},'return=representation')}
async function tpl(m){const L=await rest('GET','templates?select=*&order=sort.asc,created_at.desc');
  m.innerHTML='<h1>Templates</h1><div class="drop" id="drop">Drop SVG or .masar files here, or <a href="#" id="pick">choose files</a>.<br><span class="muted">Each file becomes a draft. Set its title, category and thumbnail, then publish it.</span><input type="file" id="fi" multiple accept=".svg,.masar,image/svg+xml,application/json" hidden></div>'+
   '<div class="tools"><span class="muted">'+L.length+' templates · '+L.filter(t=>t.published).length+' published</span></div><div class="tg">'+L.map(t=>'<div class="tc" data-id="'+t.id+'"><div class="th">'+(t.thumb_path?'<img alt="" src="'+esc(pub(t.thumb_path))+'">':'<span class="muted">no thumbnail</span>')+'</div>'+
    '<input type="text" data-f="title" value="'+esc(t.title)+'" placeholder="Title"><input type="text" data-f="category" value="'+esc(t.category)+'" placeholder="Category"><input type="text" data-f="tags" value="'+esc((t.tags||[]).join(', '))+'" placeholder="tags, comma separated">'+
    '<div class="row"><span class="muted">'+(+t.width)+' × '+(+t.height)+' '+esc(t.unit||'px')+'</span><label class="muted"><input type="checkbox" data-f="published"'+(t.published?' checked':'')+'> Published</label><input type="number" data-f="sort" value="'+t.sort+'" title="Order" style="width:60px"></div>'+
    '<div class="row"><button class="b p" data-save>Save</button><button class="b" data-thumb>Thumbnail…</button><button class="b x" data-del>Delete</button></div></div>').join('')+'</div>';
  const fi=$('#fi'),drop=$('#drop');$('#pick').onclick=e=>{e.preventDefault();fi.click()};
  const take=async files=>{let n=0;const bad=[];for(const f of files){try{drop.firstChild.textContent='Uploading '+f.name+'…';await addTemplate(f);n++}catch(e){bad.push(f.name+': '+e.message)}}msg(n+' template'+(n===1?'':'s')+' uploaded as drafts'+(bad.length?' · failed: '+bad.join(' | '):''),bad.length);tpl(m)};
  fi.onchange=()=>take([...fi.files]);drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');take([...e.dataTransfer.files])};
  m.querySelectorAll('.tc').forEach(c=>{const id=c.dataset.id,t=L.find(x=>x.id===id),v=f=>c.querySelector('[data-f="'+f+'"]');
    c.querySelector('[data-save]').onclick=async()=>{try{await rest('PATCH','templates?id=eq.'+id,{title:v('title').value.trim()||'Untitled',category:v('category').value.trim()||'General',tags:v('tags').value.split(',').map(s=>s.trim()).filter(Boolean),published:v('published').checked,sort:+v('sort').value||0},'return=minimal');msg('Saved')}catch(e){msg(e.message,1)}};
    c.querySelector('[data-thumb]').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const p=id+'-'+Date.now().toString(36)+'.'+(f.name.split('.').pop()||'jpg');await upload('template-thumbs',p,f);await rest('PATCH','templates?id=eq.'+id,{thumb_path:p},'return=minimal');tpl(m)}catch(e){msg(e.message,1)}};i.click()};
    c.querySelector('[data-del]').onclick=async()=>{if(!confirm('Delete "'+t.title+'" for good?'))return;try{await rest('DELETE','templates?id=eq.'+id);await remove('templates',[t.file_path]);if(t.thumb_path)await remove('template-thumbs',[t.thumb_path]);tpl(m)}catch(e){msg(e.message,1)}}})}
/* ---------- Home banner ---------- */
async function ann(m){const s=(await rest('GET','settings?id=eq.1&select=announcement'))[0],a=s.announcement||{};
  m.innerHTML='<h1>Home banner</h1><p class="muted">Shown at the top of Masar\'s Home for everyone. Leave the title empty to hide it.</p><div class="form">'+
   '<label><span>Title</span><input data-k="title" value="'+esc(a.title||'')+'" style="flex:1"></label><label><span>Text</span><input data-k="text" value="'+esc(a.text||'')+'" style="flex:1"></label>'+
   '<label><span>Link (https://…)</span><input data-k="link" value="'+esc(a.link||'')+'" style="flex:1"></label><label><span>Image</span><input data-k="image" value="'+esc(a.image||'')+'" style="flex:1" placeholder="https://…"><button class="b" id="up">Upload…</button></label>'+
   '<button class="b p" id="sv">Save</button></div>';
  $('#up').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const p='banners/'+Date.now().toString(36)+'.'+(f.name.split('.').pop()||'jpg');await upload('template-thumbs',p,f);m.querySelector('[data-k=image]').value=pub(p);msg('Image uploaded')}catch(e){msg(e.message,1)}};i.click()};
  $('#sv').onclick=async()=>{const v=k=>m.querySelector('[data-k="'+k+'"]').value.trim();const link=v('link'),img=v('image');if((link&&!/^https:\/\//.test(link))||(img&&!/^https:\/\//.test(img)))return msg('Links must start with https://',1);
    try{await rest('PATCH','settings?id=eq.1',{announcement:v('title')?{title:v('title'),text:v('text'),link,image:img}:{}},'return=minimal');msg('Saved')}catch(e){msg(e.message,1)}}}
/* ---------- emails ---------- */
async function mail(m){const L=await rest('GET','email_log?select=created_at,to_email,kind,provider,ok,error&order=created_at.desc&limit=200');
  m.innerHTML='<h1>Emails</h1><p class="muted">Every email goes through Brevo, then Mailjet, then Resend, then Amazon SES, so it never stops.</p><table><thead><tr><th>Time</th><th>To</th><th>Kind</th><th>Provider</th><th>Result</th></tr></thead><tbody>'+
    L.map(e=>'<tr><td>'+new Date(e.created_at).toLocaleString()+'</td><td>'+esc(e.to_email)+'</td><td>'+esc(e.kind)+'</td><td>'+esc(e.provider)+'</td><td>'+(e.ok?'<span class="pill active">sent</span>':'<span class="err" title="'+esc(e.error||'')+'">failed: '+esc((e.error||'').slice(0,80))+'</span>')+'</td></tr>').join('')+'</tbody></table>'}
start();
</script>
