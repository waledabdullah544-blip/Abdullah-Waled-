# Optional: write "@claude ..." in an issue or a pull request comment and Claude makes the change as a pull request.
# Needs secret CLAUDE_CODE_OAUTH_TOKEN (run "claude setup-token" in Claude Code; uses your Claude plan).
name: Claude
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') && github.event.issue.user.login == github.repository_owner) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
