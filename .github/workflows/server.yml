# Deploys the Masar server (database changes + functions) to Supabase whenever supabase/ changes on main.
# Needs (repo Settings › Secrets and variables › Actions):
#   variable SUPABASE_PROJECT_REF   secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
name: Deploy Masar server
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push
      - run: supabase functions deploy --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
